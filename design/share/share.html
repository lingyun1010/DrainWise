<!doctype html><meta charset="utf-8" />
<style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 1200px;
    height: 630px;
    background: radial-gradient(900px 500px at 78% 40%, #16435f 0%, #0b2233 70%);
    color: #eaf6fb;
    font-family: "Avenir Next Rounded", "Arial Rounded MT Bold", "Nunito", "Helvetica Neue", sans-serif;
    position: relative;
    overflow: hidden;
  }
  .wave {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 110px;
  }
  .left {
    position: absolute;
    left: 80px;
    top: 110px;
    width: 700px;
  }
  .wm {
    width: 480px;
    display: block;
  }
  h1 {
    font-size: 40px;
    line-height: 1.15;
    margin-top: 34px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  h1 em {
    font-style: normal;
    color: #4fc3e8;
  }
  p {
    margin-top: 18px;
    font-size: 22px;
    color: #8fb8cc;
    line-height: 1.4;
  }
  .tag {
    position: absolute;
    left: 80px;
    bottom: 64px;
    font-size: 20px;
    color: #cfe6f0;
    border: 2px solid #2d6182;
    border-radius: 999px;
    padding: 8px 20px;
    background: #102f45;
  }
  .m {
    position: absolute;
    right: 80px;
    top: 130px;
    width: 340px;
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.4));
  }
</style>
<svg class="wave" viewBox="0 0 1200 110" preserveAspectRatio="none">
  <path d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 V110 H0Z" fill="#102f45" />
  <path d="M0 75 Q150 40 300 75 T600 75 T900 75 T1200 75 V110 H0Z" fill="#1e4a63" />
</svg>
<div class="left">
  <img class="wm" src="brand-wordmark.png" />
  <h1>Clean the right gross pollutant traps<br /><em>before they fill.</em></h1>
  <p>Predict which GPTs block next, then plan the truck run.</p>
</div>
<img class="m" src="brand-mascot.png" />
<div class="tag">Sample data · City of Parramatta hackathon</div>
